[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "resume-tailor"
version = "0.1.0"
description = "Local, single-user resume tailoring over a plain-file career knowledge base"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9",
    "ruamel.yaml>=0.18",
    "jinja2>=3.1",
    "typer>=0.12",
    # The default backend. Declared rather than left optional because the tool
    # does nothing useful without a model, and claude_sdk is what it reaches
    # for unless told otherwise. The other backends are subprocesses or plain
    # HTTP and need no package.
    "claude-agent-sdk>=0.2",
    # M5. uvicorn is a runtime dependency rather than a dev one because
    # `rt serve` is how the tool is actually used.
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "watchdog>=5.0",
]

[project.optional-dependencies]
tracing = ["langfuse>=4.0"]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "ruff>=0.7", "httpx>=0.27"]

[project.scripts]
rt = "resume_tailor.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/resume_tailor"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: hits a real model backend or the network; excluded by default",
]
addopts = "-m 'not live'"
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Typer declares CLI options as argument defaults; that IS the library's idiom,
# and the alternative ruff suggests would make every command noisier.
"src/resume_tailor/cli.py" = ["B008"]
# FastAPI declares request bodies and query params as argument defaults, the
# same way Typer declares options. That IS the library's idiom.
"src/resume_tailor/api/app.py" = ["B008"]
